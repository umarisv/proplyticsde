[project]
name = "prop-ai"
version = "0.1.0"
description = "Immobilienanalyse Pipeline mit Scraping & Feature Engineering"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
