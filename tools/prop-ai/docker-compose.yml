version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: propai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prop_ai
    ports:
      - "5432:5432"
    volumes:
      - propai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prop_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propai-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/prop_ai
      API_PORT: 8503
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8503:8503"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.main", "run_api"]

volumes:
  propai_pgdata:
