name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to production?'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # CI Job - Test & Build
  test-and-build:
    name: 🔍 Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Setup pnpm
        uses: actions/setup-pnpm@v4
        with:
          version: "10.28.1"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run linter
        run: pnpm lint

      - name: 🏗️ Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: 🐳 Login to Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 📤 Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # CD Job - Deploy to Server
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.deploy_to_production == 'true')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Server
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /opt/proplytics

            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main

            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker compose down

            # Start new containers
            echo "🚀 Starting new containers..."
            docker compose up --build -d

            # Wait for containers to be healthy
            echo "⏳ Waiting for containers to be healthy..."
            sleep 30

            # Check container status
            echo "📊 Container status:"
            docker ps

            # Test application health
            echo "🏥 Health check:"
            if curl -f --max-time 30 http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Application is healthy!"
              echo "🌐 Available at: https://proplytics.de"
            else
              echo "❌ Application health check failed"
              docker compose logs
              exit 1
            fi

            # Cleanup old images
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f
          EOF

      - name: 📢 Deployment Success
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "🌐 Application available at: https://proplytics.de"
          echo "📊 New features:"
          echo "  - Enhanced Bankmappe with PDF export"
          echo "  - Interactive LTV simulator"
          echo "  - Energy efficiency visualization"
          echo "  - Bank readiness scoring"

      - name: 🚨 Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the server logs and GitHub Actions logs for details."