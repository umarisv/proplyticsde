name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to production?'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # CI Job - Test & Build
  test-and-build:
    name: 🔍 Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Setup pnpm
        uses: actions/setup-pnpm@v4
        with:
          version: "10.28.1"

      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile

      - name: 🔍 Run linter
        run: |
          echo "🔍 Running linter..."
          pnpm lint

      - name: 🏗️ Build application
        run: |
          echo "🏗️ Building application..."
          echo "Environment variables check:"
          echo "NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:+SET}"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:+SET}"
          echo "NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:+SET}"
          echo "OPENAI_API_KEY: ${OPENAI_API_KEY:+SET}"
          echo "STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:+SET}"
          pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'dummy-url' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-key' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://proplytics.de' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-key' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'dummy-key' }}

      - name: 🐳 Login to Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          # Build Docker image
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

          # Tag with commit SHA
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Push images
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "✅ Docker image pushed successfully!"

  # CD Job - Deploy to Server
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.deploy_to_production == 'true')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH (Optional)
        if: env.SERVER_HOST != ''
        run: |
          if [ -n "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" ] && [ -n "${{ secrets.SERVER_HOST }}" ]; then
            mkdir -p ~/.ssh
            echo "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
            echo "SSH_SETUP=true" >> $GITHUB_ENV
          else
            echo "SSH_SETUP=false" >> $GITHUB_ENV
            echo "⚠️ SSH credentials not configured - skipping deployment"
          fi

      - name: 🚀 Deploy to Server
        if: env.SSH_SETUP == 'true'
        run: |
          echo "🚀 Starting deployment to ${{ secrets.SERVER_HOST }}..."
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /opt/proplytics

            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main

            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker compose down

            # Start new containers
            echo "🚀 Starting new containers..."
            docker compose up --build -d

            # Wait for containers to be healthy
            echo "⏳ Waiting for containers to be healthy..."
            sleep 30

            # Check container status
            echo "📊 Container status:"
            docker ps

            # Test application health
            echo "🏥 Health check:"
            if curl -f --max-time 30 http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Application is healthy!"
              echo "🌐 Available at: https://proplytics.de"
            else
              echo "❌ Application health check failed"
              docker compose logs
              exit 1
            fi

            # Cleanup old images
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f
          EOF

      - name: 📢 Deployment Success
        if: success() && env.SSH_SETUP == 'true'
        run: |
          echo "🎉 Deployment successful!"
          echo "🌐 Application available at: https://proplytics.de"
          echo "📊 New features:"
          echo "  - New geometric landing page design"
          echo "  - Removed time/accuracy claims"
          echo "  - Enhanced Bankmappe features"

      - name: 📋 Build Success (No Deployment)
        if: env.SSH_SETUP != 'true'
        run: |
          echo "✅ Build successful!"
          echo "📦 Docker image pushed to GitHub Container Registry"
          echo "⚠️ Deployment skipped - SSH credentials not configured"
          echo "🔧 To enable deployment:"
          echo "   1. Go to Repository Settings → Secrets"
          echo "   2. Add SERVER_HOST, SERVER_SSH_PRIVATE_KEY"
          echo "   3. Next push will deploy automatically"

      - name: 🚨 Deployment Failed
        if: failure() && env.SSH_SETUP == 'true'
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the server logs and GitHub Actions logs for details."